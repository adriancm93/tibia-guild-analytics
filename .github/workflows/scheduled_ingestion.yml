name: Scheduled Supabase Batch Guild Ingestion

on:
  schedule:
    # Runs every 30 minutes at the 17th and 47th minute of the hour
    - cron: "7,22,37,52 * * * *"

  workflow_dispatch:

concurrency:
  group: scheduled-supabase-batch-guild-ingestion
  cancel-in-progress: false
  
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RAW_DATA_DIR: data/raw
  GUILD_BATCH_SIZE: 50

jobs:
  run-batch-guild-ingestion:
    name: Run batch guild ingestion
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ingestion dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ingestion/requirements-ci.txt

      - name: Confirm environment configuration
        env:
          POSTGRES_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          POSTGRES_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          POSTGRES_DB: ${{ secrets.SUPABASE_DB_NAME }}
          POSTGRES_USER: ${{ secrets.SUPABASE_DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          test -n "$POSTGRES_HOST"
          test -n "$POSTGRES_PORT"
          test -n "$POSTGRES_DB"
          test -n "$POSTGRES_USER"
          test -n "$POSTGRES_PASSWORD"
          echo "Environment configuration found."

      - name: Run batch guild ingestion
        env:
          POSTGRES_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          POSTGRES_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          POSTGRES_DB: ${{ secrets.SUPABASE_DB_NAME }}
          POSTGRES_USER: ${{ secrets.SUPABASE_DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          RAW_DATA_DIR: data/raw
          GUILD_BATCH_SIZE: 50
        run: |
          python ingestion/src/run_batch_guild_ingestion.py